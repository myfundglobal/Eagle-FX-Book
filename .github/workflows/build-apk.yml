name: Build APK
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: eagle-fx-book-github
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: /Eagle-FX-Book/
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Generate icons
        run: |
          if [ -f assets/icon-only.png ]; then npx capacitor-assets generate --android; fi
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: eagle-fx-book-github/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Eagle-FX-Book-APK
          path: eagle-fx-book-github/android/app/build/outputs/apk/debug/app-debug.apk
